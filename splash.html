<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .splash{height:100%;display:grid;place-items:center;background:#09090d;border-radius:22px;color:#f4f1ff;box-shadow:0 24px 80px #0008;animation:fade-in 1.2s ease both}
    .content{text-align:center}.name{display:flex;justify-content:center;gap:7px;font-size:34px;font-weight:700;letter-spacing:-.05em}.name span{opacity:0;transform:translateY(14px);animation:letter-in .8s cubic-bezier(.2,.8,.2,1) forwards}.name span:nth-child(1){animation-delay:.75s}.name span:nth-child(2){animation-delay:.95s}.name span:nth-child(3){animation-delay:1.15s}.name span:nth-child(4){animation-delay:1.35s}.name span:nth-child(5){animation-delay:1.55s}.name span:nth-child(6){animation-delay:1.75s}.name span:nth-child(7){animation-delay:1.95s}
    .mark{width:84px;height:84px;margin:40px auto 0;border-radius:27px;display:grid;place-items:center;background:#8066ed;color:#fff;font-size:47px;box-shadow:0 0 0 0 #8066ed88;opacity:0;transform:translateX(-300px) rotate(-540deg);animation:roll-in 2.1s 2.45s cubic-bezier(.18,.86,.22,1) forwards}
    .line{height:3px;width:0;margin:27px auto 0;border-radius:4px;background:#8066ed;animation:line-in .9s 4.15s ease forwards}.status{opacity:0;margin-top:22px;color:#9b98a6;font-size:12px;animation:status-in .6s 4.45s ease forwards}
    @keyframes fade-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}@keyframes letter-in{to{opacity:1;transform:none}}@keyframes roll-in{0%{opacity:0;transform:translateX(-300px) rotate(-540deg)}18%{opacity:1}72%{opacity:1;transform:translateX(28px) rotate(540deg)}100%{opacity:1;transform:translateX(0) rotate(360deg);box-shadow:0 0 44px #8066ed88}}@keyframes line-in{to{width:116px}}@keyframes status-in{to{opacity:1}}
  </style>
</head>
<body><main class="splash"><div class="content"><div class="name"><span>m</span><span>e</span><span>m</span><span>o</span><span>r</span><span>y</span><span>y</span></div><div class="mark">✦</div><div class="line"></div><div class="status">Загружаем твоё пространство…</div></div></main></body>
</html>
