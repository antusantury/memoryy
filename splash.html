<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;font-family:Inter,ui-sans-serif,system-ui,sans-serif}
    .splash{height:100%;display:grid;place-items:center;background:#09090d;border-radius:22px;color:#f4f1ff;box-shadow:0 24px 80px #0008;animation:fade-in 1.2s ease both;contain:paint;transition:opacity .45s ease,transform .45s ease}.splash-closing .splash{opacity:0;transform:scale(.985)}
    .content{text-align:center}.name{display:flex;justify-content:center;gap:7px;font-size:34px;font-weight:700;letter-spacing:-.05em}.name span{opacity:0;transform:translateY(14px);animation:letter-in .8s cubic-bezier(.2,.8,.2,1) forwards;will-change:opacity,transform}.name span:nth-child(1){animation-delay:.75s}.name span:nth-child(2){animation-delay:.95s}.name span:nth-child(3){animation-delay:1.15s}.name span:nth-child(4){animation-delay:1.35s}.name span:nth-child(5){animation-delay:1.55s}.name span:nth-child(6){animation-delay:1.75s}.name span:nth-child(7){animation-delay:1.95s}
    .mark{width:84px;height:84px;margin:40px auto 0;border-radius:27px;display:grid;place-items:center;background:#8066ed;color:#fff;font-size:47px;box-shadow:0 0 28px #8066ed55;opacity:0;transform:translate3d(-300px,0,0) rotate(-180deg);animation:roll-in 1.8s 2.45s cubic-bezier(.18,.86,.22,1) forwards;will-change:opacity,transform;backface-visibility:hidden}
    .line{height:3px;width:0;margin:27px auto 0;border-radius:4px;background:#8066ed;animation:line-in .9s 5.75s ease forwards;will-change:width}.status{opacity:0;margin-top:22px;color:#9b98a6;font-size:12px;animation:status-in .6s 6.05s ease forwards;will-change:opacity}
    @keyframes fade-in{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:none}}@keyframes letter-in{to{opacity:1;transform:none}}@keyframes roll-in{0%{opacity:0;transform:translate3d(-300px,0,0) rotate(-180deg)}12%{opacity:1}72%{opacity:1;transform:translate3d(20px,0,0) rotate(18deg)}100%{opacity:1;transform:translate3d(0,0,0) rotate(0)}}@keyframes line-in{to{width:116px}}@keyframes status-in{to{opacity:1}}
  </style>
</head>
<body><main class="splash"><div class="content"><div class="name"><span>m</span><span>e</span><span>m</span><span>o</span><span>r</span><span>y</span><span>y</span></div><div class="mark">✦</div><div class="line"></div><div class="status">Loading your workspace…</div></div></main></body>
</html>
