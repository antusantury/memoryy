<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Memoryy — память обучения</title>
    <link rel="stylesheet" href="/styles.css?v=5">
  </head>
  <body>
    <aside class="sidebar">
      <div class="brand"><span class="brand-mark">✦</span><span>memoryy</span></div>
      <p class="eyebrow" data-i18n="workspaceLabel">ТВОЁ ПРОСТРАНСТВО</p>
      <nav>
        <button class="nav-item active" data-view="overview">⌂ <span data-i18n="overview">Обзор</span></button>
        <button class="nav-item" data-view="copilot">✦ <span data-i18n="aiChat">AI-чат</span></button>
        <button class="nav-item" data-view="sessions">▤ <span data-i18n="library">Библиотека</span></button>
        <button class="nav-item" data-view="import">＋ <span data-i18n="import">Импорт контекста</span></button>
        <button class="nav-item" data-view="timeline">⌁ <span data-i18n="knowledgeMap">Карта знаний</span></button>
      </nav>
      <div class="sidebar-footer"><button id="theme-settings" class="nav-item">⚙ <span data-i18n="settings">Настройки</span></button><div class="local-status"><span class="status-dot"></span> <span data-i18n="localOnly">Локально на устройстве</span></div></div>
    </aside>
    <main>
      <header class="topbar"><div><p class="eyebrow" data-i18n="workspace">WORKSPACE</p><h1 id="page-title">Обзор обучения</h1></div><div class="topbar-tools"><div class="ai-indicator-wrap"><button id="ai-indicator" class="ai-indicator" aria-label="Статус AI"><span></span></button><div class="ai-tooltip"><strong id="ai-tooltip-title">Проверяем AI</strong><small id="ai-tooltip-text">Подключение проверяется…</small><button id="ai-tooltip-settings">Перейти в настройки →</button></div><span data-i18n="aiLibrarian">AI-библиотекарь</span></div><div id="topbar-action"></div></div></header>
      <section id="app"></section>
    </main>
    <div id="toast" class="toast"></div>
    <script type="module" src="/app.js"></script>
  </body>
</html>
